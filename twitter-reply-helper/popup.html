<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
</head>
<body class="popup">
  <header>
    <strong>Reply Helper</strong>
    <a href="#" id="settings" title="Settings">⚙︎</a>
  </header>

  <div id="post" class="post hidden"></div>

  <div class="controls">
    <select id="tone">
      <option value="">Let the voice guide choose</option>
      <option value="funny and playful">Funny</option>
      <option value="insightful, adds real value">Insightful</option>
      <option value="supportive and warm">Supportive</option>
      <option value="respectful but pushes back / disagrees">Push back</option>
      <option value="curious, asks a good question">Curious</option>
      <option value="very short, one punchy line">Short &amp; punchy</option>
    </select>
    <input id="notes" placeholder="Optional: steer it (e.g. mention my product)">
    <button id="go">Draft replies</button>
  </div>

  <div id="status" class="status"></div>
  <div id="replies"></div>

  <div id="importBox" class="import hidden">
    <p>You're on your replies page. Import your real replies as style examples?</p>
    <button id="import">Import my replies</button>
    <textarea id="dump" class="hidden" rows="8" readonly></textarea>
    <button id="copyDump" class="hidden">Copy all as text</button>
  </div>

  <div class="own">
    <input id="own" placeholder="Wrote your own reply? Paste it to teach your style">
    <button id="saveOwn">Save</button>
  </div>

  <script src="extract.js"></script>
  <script src="popup.js"></script>
</body>
</html>
